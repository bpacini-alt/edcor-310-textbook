enture</text><text x="534" y="255" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#1a3a5c">Call to</text><text x="534" y="268" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#1a3a5c">adventure</text><!-- 3 · Refusal of call — θ=90° → (520, 350) --><circle cx="520" cy="350" r="28" fill="#1a3a5c" stroke="#1a3a5c" stroke-width="1.5"></circle><text x="520" y="346" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">3</text><text x="520" y="357" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#aec8e0">Refusal</text><text x="520" y="367" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#aec8e0">of call</text><text x="558" y="348" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#1a3a5c">Refusal of call</text><!-- 4 · Meeting the mentor — θ=120° → (496, 440) --><circle cx="496" cy="440" r="28" fill="#2a7a4f" stroke="#2a7a4f" stroke-width="1.5"></circle><text x="496" y="436" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">4</text><text x="496" y="447" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c8e8d4">Meeting</text><text x="496" y="457" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c8e8d4">mentor</text><text x="534" y="435" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#2a7a4f">Meeting</text><text x="534" y="448" text-anchor="start" font-family="sans-serif" font-size="11" font-weight="700" fill="#2a7a4f">the mentor</text><!-- 5 · Crossing the threshold — θ=150° → (430, 506) --><circle cx="430" cy="506" r="28" fill="#2a7a4f" stroke="#2a7a4f" stroke-width="1.5"></circle><text x="430" y="502" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">5</text><text x="430" y="513" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c8e8d4">Crossing</text><text x="430" y="523" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c8e8d4">threshold</text><text x="430" y="548" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2a7a4f">Crossing the threshold</text><!-- 6 · Tests, allies, enemies — θ=180° → (340, 530) --><circle cx="340" cy="530" r="28" fill="#2a7a4f" stroke="#2a7a4f" stroke-width="1.5"></circle><text x="340" y="526" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">6</text><text x="340" y="537" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c8e8d4">Tests &amp;</text><text x="340" y="547" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c8e8d4">allies</text><text x="340" y="575" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2a7a4f">Tests, allies, enemies</text><!-- 7 · Approach innermost cave — θ=210° → (250, 506) --><circle cx="250" cy="506" r="28" fill="#2a7a4f" stroke="#2a7a4f" stroke-width="1.5"></circle><text x="250" y="502" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">7</text><text x="250" y="513" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c8e8d4">Approach</text><text x="250" y="523" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c8e8d4">the cave</text><text x="250" y="548" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#2a7a4f">Approach to the cave</text><!-- 8 · Ordeal — θ=240° → (184, 440) --><circle cx="184" cy="440" r="28" fill="#2a7a4f" stroke="#2a7a4f" stroke-width="1.5"></circle><text x="184" y="436" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">8</text><text x="184" y="447" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#c8e8d4">Ordeal</text><text x="144" y="438" text-anchor="end" font-family="sans-
