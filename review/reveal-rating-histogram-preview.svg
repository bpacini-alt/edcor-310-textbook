<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Rating histogram reveal prototype</title>
  <desc id="desc">A compact reading-rating table after one vote, showing four vertical histogram bars for each reading.</desc>
  <rect width="1200" height="720" fill="#f6f7f9"/>
  <text x="58" y="56" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.4" fill="#145d90">PROTOTYPE · BANG FOR BUCK</text>
  <text x="58" y="102" font-family="Georgia, serif" font-size="39" font-weight="700" fill="#1a1a1a">Vote once. Then browse the evidence.</text>
  <text x="58" y="132" font-family="Georgia, serif" font-size="19" fill="#66717d">The semester distribution appears after a real vote—or through instructor preview.</text>

  <rect x="58" y="158" width="1084" height="54" rx="9" fill="#eef6fb" stroke="#c9dbe8"/>
  <text x="78" y="192" font-family="Arial, sans-serif" font-size="15" fill="#234b65">Thanks for voting. All semester histograms are now visible.</text>
  <rect x="865" y="171" width="252" height="29" rx="6" fill="#fff" stroke="#a87d32"/>
  <text x="991" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#775817">Reveal all graphs · instructor preview</text>

  <rect x="40" y="240" width="1120" height="404" rx="10" fill="#fff" stroke="#e2e7ec"/>
  <rect x="40" y="240" width="1120" height="43" rx="10" fill="#fbfcfd"/>
  <path d="M40 283H1160" stroke="#e2e7ec"/>
  <text x="62" y="267" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#66717d">READING</text>
  <text x="745" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#66717d">YOUR VOTE</text>
  <text x="1015" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#66717d">SEMESTER DISTRIBUTION</text>

  <g font-family="Georgia, serif" font-size="17" fill="#1a1a1a">
    <text x="62" y="322">The Case for Phone-Free Schools</text>
    <text x="62" y="344" font-family="Arial, sans-serif" font-size="11" fill="#66717d">Reading 1 · aggregate semester feedback</text>
    <text x="62" y="402">Milton Friedman on Discrimination</text>
