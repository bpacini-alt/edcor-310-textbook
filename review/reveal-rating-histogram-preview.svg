<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Joy of Learning vote-preview layout</title>
  <desc id="desc">The existing reading menu with unchanged rating buttons, a plus-expanded reading with Reveal directly beneath the plus, a compact four-bar histogram, and a toggle for all votes at the bottom.</desc>
  <rect width="1200" height="760" fill="#f6f7f9"/>
  <text x="62" y="54" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2" fill="#145d90">JOY OF LEARNING · READING MENU</text>
  <text x="62" y="94" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#1a1a1a">The current page stays the same.</text>
  <text x="62" y="122" font-family="Georgia, serif" font-size="18" fill="#66717d">Votes stay quiet until a reading is opened with +.</text>

  <rect x="44" y="152" width="1112" height="450" rx="10" fill="#fff" stroke="#e2e7ec"/>
  <rect x="44" y="152" width="1112" height="46" rx="10" fill="#fbfcfd"/>
  <path d="M44 198H1156" stroke="#e2e7ec"/>
  <text x="66" y="181" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#66717d">READING</text>
  <text x="866" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#66717d">YOUR VOTE</text>
  <text x="1086" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1" fill="#66717d">+</text>

  <g font-family="Georgia, serif" fill="#1a1a1a">
    <text x="66" y="236" font-size="17">The reading title stays here</text>
    <text x="66" y="258" font-family="Arial, sans-serif" font-size="11" fill="#66717d">Existing metadata and wording stay unchanged</text>
    <text x="66" y="354" font-size="17">Another reading stays in the same row</text>
    <text x="66" y="376" font-family="Arial, sans-serif" font-size="11" fill="#66717d">The current details remain behind +</text>
  </g>
  <g stroke="#e2e7ec"><path d="M44 284H1156M44 402H1156"/></g>

  <g font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
    <g fill="#fff" stroke="#145d90"><rect x="828" y="218" width="25" height="24" rx="5"/><rect x="858" y="218" width="25" height="24" rx="5"/><rect x="888" y="218" width="25" height="24" rx="5"/><rect x="918" y="218" width="25" height="24" rx="5"/></g>
    <g fill="#66717d"><text x="840" y="234">1</text><text x="870" y="234">2</text><text x="900" y="234">3</text><text x="930" y="234">4</text></g>
    <text x="1090" y="235" font-size="22" fill="#145d90">+</text>
    <g fill="#fff" stroke="#145d90"><rect x="828" y="336" width="25" height="24" rx="5"/><rect x="858" y="336" width="25" height="24" rx="5"/><rect x="888" y="336" width="25" height="24" rx="5"/><rect x="918" y="336" width="25" height="24" rx="5"/></g>
    <g fill="#66717d"><text x="840" y="352">1</text><text x="870" y="352">2</text><text x="900" y="352">3</text><text x="930" y="352">4</text></g>
  </g>

  <rect x="66" y="410" width="1070" height="158" rx="6" fill="#fbfcfd" stroke="#e2e7ec"/>
  <text x="86" y="438" font-family="Arial, sans-serif" font-size="11" fill="#66717d">Expanded reading details remain here.</text>
  <rect x="1048" y="248" width="84" height="24" rx="5" fill="#fff" stroke="#145d90"/>
  <text x="1090" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#145d90">Reveal</text>
  <text x="86" y="472" font-family="Arial, sans-serif" font-size="11" fill="#66717d">The histogram appears here after Reveal.</text>
  <rect x="86" y="500" width="260" height="52" rx="4" fill="#fff" stroke="#e2e7ec"/>
  <g fill="#8b1e2d"><rect x="106" y="540" width="18" height="8" rx="2"/><rect x="146" y="528" width="18" height="20" rx="2"/></g>
  <g fill="#d8a928"><rect x="186" y="536" width="18" height="12" rx="2"/></g>
  <g fill="#3f8f55"><rect x="226" y="516" width="18" height="32" rx="2"/></g>
  <g fill="#168b8b"><rect x="266" y="524" width="18" height="24" rx="2"/></g>
  <g font-family="Arial, sans-serif" font-size="9" fill="#66717d" text-anchor="middle"><text x="115" y="562">1</text><text x="155" y="562">2</text><text x="195" y="562">3</text><text x="235" y="562">4</text></g>
  <text x="370" y="532" font-family="Arial, sans-serif" font-size="11" fill="#66717d">54 responses</text>

  <rect x="62" y="642" width="220" height="31" rx="6" fill="#fff" stroke="#a87d32"/>
  <text x="172" y="662" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#775817">Reveal all votes</text>
  <text x="302" y="662" font-family="Arial, sans-serif" font-size="11" fill="#66717d">quiet but findable, at page bottom; click again to hide all</text>
</svg>