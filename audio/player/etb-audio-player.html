<!-- ════ ETB AUDIO PLAYER (draft) ════
     Paste this block at the end of a chapter, after the chapter's own script.
     It needs a <script type="application/json" id="etb-audio-data"> block above it
     (the build step writes that from the chapter's audio manifest).
     It adds: a Listen button on the title card, a "Listen" link on each section
     label, a docked player, and a subtle marker on the section being read. -->
<style>
.etb-audio-on{padding-bottom:132px;}
/* Title card: listen row */
.etb-title-listen{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;margin:-.25rem 0 1.35rem;position:relative;}
.etb-listen-pill{display:inline-flex;align-items:center;gap:9px;font-family:sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#1a3a5c;background:#fff;border:1px solid #c9d3de;border-radius:99px;padding:6px 15px 6px 6px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
.etb-listen-pill:hover{background:#1a3a5c;border-color:#1a3a5c;color:#fff;}
.etb-listen-pill:focus-visible,.etb-listen-here:focus-visible,.etb-ap button:focus-visible{outline:2px solid #2a7a4f;outline-offset:2px;}
.etb-listen-ico{width:24px;height:24px;border-radius:50%;background:#1a3a5c;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s;}
.etb-listen-pill:hover .etb-listen-ico{background:#fff;}
.etb-listen-ico svg{width:9px;height:10px;fill:#fff;margin-left:2px;}
.etb-listen-pill:hover .etb-listen-ico svg{fill:#1a3a5c;}
.etb-listen-len{font-weight:400;letter-spacing:.06em;opacity:.65;}
.etb-textonly{font-family:sans-serif;font-size:11.5px;color:#999;text-decoration:none;border-bottom:1px dotted #ccc;padding-bottom:1px;}
.etb-textonly:hover{color:#1a3a5c;border-bottom-color:#1a3a5c;}
/* "Listen" on each section label */
.etb-slbl.etb-has-listen{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.etb-listen-here{font-family:sans-serif;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#bbb;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:color .15s;}
.etb-listen-here:hover{color:#1a3a5c;}
.etb-listen-here svg{width:7px;height:8px;fill:currentColor;}
.etb-listen-here .etb-eq{display:none;}
.etb-listen-here.is-current{color:#2a7a4f;}
.etb-listen-here.is-current svg{display:none;}
.etb-listen-here.is-current .etb-eq{display:inline-flex;}
.etb-app-header .etb-listen-here{margin-left:auto;color:#5a9a7f;}
.etb-app-header .etb-listen-here:hover{color:#1a3a2a;}
.etb-syn-header.etb-has-listen{display:flex;justify-content:space-between;align-items:baseline;}
.etb-syn-header .etb-listen-here{color:rgba(255,255,255,.45);}
.etb-syn-header .etb-listen-here:hover,.etb-syn-header .etb-listen-here.is-current{color:#fff;}
.etb-eq{gap:2px;align-items:flex-end;height:9px;}
.etb-eq i{display:block;width:2px;height:3px;background:currentColor;border-radius:1px;}
.etb-playing .etb-eq i{animation:etbEq 1s ease-in-out infinite;}
.etb-playing .etb-eq i:nth-child(2){animation-delay:-.4s;}
.etb-playing .etb-eq i:nth-child(3){animation-delay:-.7s;}
@keyframes etbEq{0%,100%{height:3px}50%{height:9px}}
/* Marker on the section being read */
.etb-audio-current{position:relative;}
.etb-audio-current::before{content:"";position:absolute;left:-14px;top:.35rem;bottom:2.75rem;width:2px;border-radius:2px;background:#2a7a4f;opacity:.5;}
.etb-hook.etb-audio-current::before,.etb-bigidea.etb-audio-current::before,.etb-applications.etb-audio-current::before,.etb-synthesis.etb-audio-current::before{bottom:.35rem;}
/* Docked player */
.etb-ap{position:fixed;left:0;right:0;bottom:0;z-index:9998;background:#fff;border-top:1px solid #e6e6e6;box-shadow:0 -6px 24px rgba(26,58,92,.08);transform:translateY(105%);visibility:hidden;transition:transform .28s ease,visibility 0s .28s;font-family:sans-serif;color:#1a1a1a;}
.etb-ap.is-open{transform:none;visibility:visible;transition:transform .28s ease;}
.etb-ap-in{max-width:740px;margin:0 auto;padding:.7rem 1rem calc(.8rem + env(safe-area-inset-bottom));box-sizing:border-box;}
.etb-ap button{font-family:inherit;}
.etb-ap-top{display:flex;align-items:center;gap:12px;margin-bottom:.55rem;}
.etb-ap-now{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;cursor:pointer;}
.etb-ap-kicker{display:block;font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#aaa;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.etb-ap-demo{color:#b07a1e;letter-spacing:.12em;margin-left:6px;}
.etb-ap-title{display:block;font-family:Georgia,'Times New Roman',serif;font-size:15px;font-style:italic;color:#1a3a5c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.etb-ap-now:hover .etb-ap-title{text-decoration:underline;text-decoration-color:#c9d3de;text-underline-offset:3px;}
.etb-ap-tools{display:flex;align-items:center;gap:4px;flex:none;}
.etb-ap-tool{height:30px;min-width:30px;border:0;background:none;border-radius:6px;color:#888;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.02em;padding:0 7px;}
.etb-ap-tool:hover,.etb-ap-tool[aria-expanded="true"]{background:#f2f4f7;color:#1a3a5c;}
.etb-ap-tool svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.etb-ap-speed{min-width:44px;font-variant-numeric:tabular-nums;}
.etb-ap-bot{display:flex;align-items:center;gap:10px;}
.etb-ap-skip{width:34px;height:34px;border:0;background:none;border-radius:50%;color:#777;cursor:pointer;position:relative;flex:none;display:flex;align-items:center;justify-content:center;}
.etb-ap-skip:hover{color:#1a3a5c;background:#f2f4f7;}
.etb-ap-skip svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.etb-ap-skip span{position:absolute;font-size:8px;font-weight:700;top:50%;left:50%;transform:translate(-50%,-38%);}
.etb-ap-play{width:42px;height:42px;border-radius:50%;border:0;background:#1a3a5c;color:#fff;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;}
.etb-ap-play:hover{background:#244b74;}
.etb-ap-play:active{transform:scale(.95);}
.etb-ap-play svg{width:14px;height:16px;fill:currentColor;}
.etb-ap-play .i-pause{display:none;}
.etb-playing .etb-ap-play .i-play{display:none;}
.etb-playing .etb-ap-play .i-pause{display:block;}
.etb-ap-play .i-play{margin-left:3px;}
.etb-ap-time{font-size:11px;color:#999;font-variant-numeric:tabular-nums;flex:none;min-width:34px;}
.etb-ap-time.is-end{text-align:right;}
.etb-ap-track{position:relative;flex:1;height:22px;display:flex;align-items:center;cursor:pointer;}
.etb-ap-rail{position:relative;width:100%;height:4px;border-radius:4px;background:#e9edf2;overflow:hidden;}
.etb-ap-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#2a7a4f,#1a3a5c);}
.etb-ap-tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;}
.etb-ap-thumb{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#1a3a5c;box-shadow:0 0 0 3px #fff;left:0;opacity:0;transition:opacity .15s;pointer-events:none;}
.etb-ap-track:hover .etb-ap-thumb,.etb-ap-track:focus-within .etb-ap-thumb,.etb-ap-track.is-drag .etb-ap-thumb{opacity:1;}
.etb-ap-track input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;}
.etb-ap-track:focus-within .etb-ap-rail{box-shadow:0 0 0 2px #fff,0 0 0 4px #2a7a4f;}
.etb-ap-tip{position:absolute;bottom:24px;transform:translateX(-50%);background:#1a3a5c;color:#fff;font-size:11px;line-height:1.35;padding:5px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;max-width:240px;overflow:hidden;text-overflow:ellipsis;}
.etb-ap-tip b{font-variant-numeric:tabular-nums;opacity:.7;font-weight:400;margin-right:6px;}
.etb-ap-track:hover .etb-ap-tip{opacity:1;}
/* Contents panel */
.etb-ap-menu{position:absolute;right:max(1rem,calc(50% - 370px + 1rem));bottom:calc(100% + 8px);width:330px;max-width:calc(100vw - 2rem);background:#fff;border:1px solid #e3e3e3;border-radius:10px;box-shadow:0 10px 32px rgba(26,58,92,.16);padding:.5rem 0 0;display:none;max-height:min(70vh,520px);overflow:auto;}
.etb-ap-menu.is-open{display:block;}
.etb-ap-menu-h{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#aaa;padding:.5rem 1rem .4rem;}
.etb-ap-item{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:0;text-align:left;padding:.55rem 1rem;cursor:pointer;color:#1a1a1a;}
.etb-ap-item:hover{background:#f6f7f9;}
.etb-ap-item.is-current{background:#eef6f0;}
.etb-ap-item-n{font-size:10px;font-weight:700;color:#bbb;width:16px;flex:none;font-variant-numeric:tabular-nums;}
.etb-ap-item.is-current .etb-ap-item-n{color:#2a7a4f;}
.etb-ap-item-t{flex:1;font-family:Georgia,serif;font-size:14px;line-height:1.35;}
.etb-ap-item-t small{display:block;font-family:sans-serif;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#aaa;margin-bottom:1px;}
.etb-ap-item-d{font-size:11px;color:#aaa;font-variant-numeric:tabular-nums;flex:none;}
.etb-ap-menu-foot{border-top:1px solid #eee;margin-top:.4rem;padding:.7rem 1rem .8rem;display:flex;flex-direction:column;gap:.45rem;}
.etb-ap-menu-foot a{font-size:12px;color:#1a3a5c;text-decoration:none;display:flex;align-items:center;gap:8px;}
.etb-ap-menu-foot a:hover{text-decoration:underline;}
.etb-ap-menu-foot svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.etb-ap-menu-foot span{color:#aaa;font-size:11px;}
@media (max-width:600px){
  .etb-ap-in{padding:.6rem .85rem calc(.7rem + env(safe-area-inset-bottom));}
  .etb-ap-title{font-size:14px;}
  .etb-ap-time{font-size:10.5px;min-width:30px;}
  .etb-ap-bot{gap:6px;}
  .etb-audio-current::before{left:-9px;}
  .etb-listen-here .etb-listen-len{display:none;}
  .etb-ap-kicker .etb-ap-ch{display:none;}
}
@media (prefers-reduced-motion:reduce){.etb-ap{transition:none}.etb-playing .etb-eq i{animation:none;height:6px}}
@media print{.etb-ap,.etb-title-listen,.etb-listen-here{display:none!important}}
</style>
<script>
(function () {
  var dataEl = document.getElementById('etb-audio-data');
  var root = document.querySelector('.etb');
  if (!dataEl || !root) return;
  var D = JSON.parse(dataEl.textContent);
  var base = D.base || '';
  var S = D.sections.map(function (s) { return { id: s.id, title: s.title, label: s.label, src: base + s.audio, dur: s.est_seconds || 0 }; });
  var KEY = 'etb-audio:' + (D.book || 'book') + ':' + D.chapter;

  /* ---- helpers ---- */
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function fmt(t) { t = Math.max(0, Math.round(t || 0)); var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (s < 10 ? '0' : '') + s; }
  function mins(t) { return Math.max(1, Math.round(t / 60)) + ' min'; }
  function store(k, v) { try { if (v === undefined) { var x = localStorage.getItem(k); return x ? JSON.parse(x) : null; } localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
  var PLAY = '<svg viewBox="0 0 9 10" aria-hidden="true"><path d="M0 0l9 5-9 5z"/></svg>';
  var EQ = '<span class="etb-eq" aria-hidden="true"><i></i><i></i><i></i></span>';
  var ICON = {
    back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 3v4h4"/></svg>',
    fwd: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v4h-4"/></svg>',
    list: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>',
    close: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    down: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
    doc: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>'
  };

  /* ---- find each section's place in the text ---- */
  var concepts = root.querySelectorAll('.etb-concept');
  S.forEach(function (s) {
    if (s.id === 'intro') s.els = [root.querySelector('.etb-hook'), root.querySelector('.etb-bigidea')].filter(Boolean);
    else if (/^concept-\d+$/.test(s.id)) s.els = [concepts[parseInt(s.id.split('-')[1], 10) - 1]].filter(Boolean);
    else if (s.id === 'applications') s.els = [root.querySelector('.etb-applications')].filter(Boolean);
    else if (s.id === 'synthesis') s.els = [root.querySelector('.etb-synthesis')].filter(Boolean);
    else s.els = [];
  });

  var offsets = [], total = 0;
  function recalc() { total = 0; S.forEach(function (s, i) { offsets[i] = total; total += s.dur; }); }
  recalc();

  /* ---- title card: Listen button + text-only link ---- */
  var card = root.querySelector('.etb-title-card');
  var pill, pillText;
  if (card) {
    var row = el('div', 'etb-title-listen');
    pill = el('button', 'etb-listen-pill');
    pill.type = 'button';
    pill.innerHTML = '<span class="etb-listen-ico">' + PLAY + '</span><span class="etb-listen-txt">Listen</span><span class="etb-listen-len">· ' + mins(total) + '</span>';
    pillText = pill.querySelector('.etb-listen-txt');
    row.appendChild(pill);
    if (D.text_url) {
      var t = el('a', 'etb-textonly', 'Text-only version');
      t.href = D.text_url;
      row.appendChild(t);
    }
    var meta = card.querySelector('.etb-title-meta');
    card.insertBefore(row, meta || null);
    pill.addEventListener('click', function () {
      var saved = resumeAt();
      open(); if (saved) seek(saved, true); else seek(0, true);
    });
  }

  /* ---- "Listen" link on each section label ---- */
  S.forEach(function (s, i) {
    var host = null, sec = s.els[0];
    if (!sec || s.id === 'intro') return;
    if (/^concept/.test(s.id)) host = sec.querySelector('.etb-slbl');
    else if (s.id === 'applications') host = sec.querySelector('.etb-app-header');
    else if (s.id === 'synthesis') host = sec.querySelector('.etb-syn-header');
    if (!host) return;
    var b = el('button', 'etb-listen-here', PLAY + EQ + '<span class="etb-listen-word">Listen</span><span class="etb-listen-len">· ' + fmt(s.dur) + '</span>');
    b.type = 'button';
    b.setAttribute('aria-label', 'Listen from ' + s.title);
    b.addEventListener('click', function () {
      if (cur === i && !audio.paused) { audio.pause(); return; }
      open(); seek(offsets[i], true);
    });
    host.classList.add('etb-has-listen');
    host.appendChild(b);
    s.btn = b;
  });

  /* ---- player ---- */
  var ap = el('div', 'etb-ap');
  ap.setAttribute('role', 'region');
  ap.setAttribute('aria-label', 'Chapter audio');
  ap.innerHTML =
    '<div class="etb-ap-in">' +
      '<div class="etb-ap-top">' +
        '<button type="button" class="etb-ap-now" title="Show this part of the chapter"><span class="etb-ap-kicker"></span><span class="etb-ap-title"></span></button>' +
        '<div class="etb-ap-tools">' +
          '<button type="button" class="etb-ap-tool etb-ap-speed" aria-label="Playback speed">1×</button>' +
          '<button type="button" class="etb-ap-tool etb-ap-list" aria-label="Contents and downloads" aria-expanded="false">' + ICON.list + '</button>' +
          '<button type="button" class="etb-ap-tool etb-ap-close" aria-label="Close player">' + ICON.close + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="etb-ap-bot">' +
        '<button type="button" class="etb-ap-skip etb-ap-back" aria-label="Back 15 seconds">' + ICON.back + '<span>15</span></button>' +
        '<button type="button" class="etb-ap-play" aria-label="Play"><svg class="i-play" viewBox="0 0 9 10" aria-hidden="true"><path d="M0 0l9 5-9 5z"/></svg><svg class="i-pause" viewBox="0 0 14 16" aria-hidden="true"><rect x="1" y="1" width="4" height="14" rx="1"/><rect x="9" y="1" width="4" height="14" rx="1"/></svg></button>' +
        '<button type="button" class="etb-ap-skip etb-ap-fwd" aria-label="Forward 15 seconds">' + ICON.fwd + '<span>15</span></button>' +
        '<span class="etb-ap-time etb-ap-cur">0:00</span>' +
        '<div class="etb-ap-track"><div class="etb-ap-rail"><div class="etb-ap-fill"></div></div><div class="etb-ap-thumb"></div><div class="etb-ap-tip"></div><input type="range" min="0" max="1000" step="1" value="0" aria-label="Seek"></div>' +
        '<span class="etb-ap-time etb-ap-dur is-end">0:00</span>' +
      '</div>' +
    '</div>' +
    '<div class="etb-ap-menu" role="dialog" aria-label="Chapter audio contents"></div>';
  document.body.appendChild(ap);

  var q = function (s) { return ap.querySelector(s); };
  var kicker = q('.etb-ap-kicker'), titleEl = q('.etb-ap-title'), playBtn = q('.etb-ap-play'),
      curT = q('.etb-ap-cur'), durT = q('.etb-ap-dur'), track = q('.etb-ap-track'), rail = q('.etb-ap-rail'),
      fill = q('.etb-ap-fill'), thumb = q('.etb-ap-thumb'), tip = q('.etb-ap-tip'), range = q('.etb-ap-track input'),
      speedBtn = q('.etb-ap-speed'), listBtn = q('.etb-ap-list'), menu = q('.etb-ap-menu');

  var audio = new Audio();
  audio.preload = 'metadata';
  var cur = -1, dragging = false, rate = store('etb-audio:rate') || 1;
  var RATES = [0.75, 1, 1.25, 1.5, 1.75, 2];

  /* real durations replace the estimates as soon as each file's header loads */
  S.forEach(function (s) {
    var a = new Audio(); a.preload = 'metadata';
    a.addEventListener('loadedmetadata', function () { if (isFinite(a.duration) && a.duration > 0) { s.dur = a.duration; recalc(); paintTicks(); buildMenu(); paint(); } });
    a.src = s.src;
  });

  function paintTicks() {
    rail.querySelectorAll('.etb-ap-tick').forEach(function (t) { t.remove(); });
    for (var i = 1; i < S.length; i++) { var t = el('div', 'etb-ap-tick'); t.style.left = (offsets[i] / total * 100) + '%'; rail.appendChild(t); }
  }

  function buildMenu() {
    var h = '<div class="etb-ap-menu-h">In this chapter</div>';
    S.forEach(function (s, i) {
      h += '<button type="button" class="etb-ap-item' + (i === cur ? ' is-current' : '') + '" data-i="' + i + '"><span class="etb-ap-item-n">' + (i + 1) + '</span><span class="etb-ap-item-t"><small>' + s.label + '</small>' + s.title + '</span><span class="etb-ap-item-d">' + fmt(s.dur) + '</span></button>';
    });
    h += '<div class="etb-ap-menu-foot">';
    if (D.full_url) h += '<a href="' + D.full_url + '" download>' + ICON.down + 'Download the whole chapter (MP3) <span>' + mins(total) + '</span></a>';
    if (D.text_url) h += '<a href="' + D.text_url + '">' + ICON.doc + 'Text-only version</a>';
    h += '</div>';
    menu.innerHTML = h;
    menu.querySelectorAll('.etb-ap-item').forEach(function (b) {
      b.addEventListener('click', function () { seek(offsets[+b.dataset.i], true); toggleMenu(false); });
    });
  }

  function sectionAt(t) { for (var i = S.length - 1; i >= 0; i--) if (t >= offsets[i] - 0.01) return i; return 0; }
  function globalTime() { return cur < 0 ? 0 : offsets[cur] + (audio.currentTime || 0); }
  function resumeAt() { var v = store(KEY); return v && v.t > 15 && v.t < total - 15 ? v.t : 0; }

  function load(i, local, play) {
    cur = i;
    var go = function () {
      audio.removeEventListener('loadedmetadata', go);
      try { audio.currentTime = local; } catch (e) {}
      audio.defaultPlaybackRate = audio.playbackRate = rate;
      if (play) audio.play().catch(function () {});
    };
    audio.addEventListener('loadedmetadata', go);
    audio.src = S[i].src;
    markCurrent();
  }

  function seek(t, play) {
    t = Math.max(0, Math.min(total - 0.25, t));
    var i = sectionAt(t), local = t - offsets[i];
    if (i !== cur) load(i, local, play !== undefined ? play : !audio.paused);
    else { audio.currentTime = local; if (play) audio.play().catch(function () {}); }
    paint(t);
  }

  function markCurrent() {
    S.forEach(function (s, i) {
      s.els.forEach(function (e) { e.classList.toggle('etb-audio-current', i === cur); });
      if (s.btn) s.btn.classList.toggle('is-current', i === cur);
    });
    wordState();
    var s = S[cur];
    kicker.innerHTML = '<span class="etb-ap-ch">Chapter ' + D.chapter + ' · </span>' + s.label + (D.placeholder ? '<span class="etb-ap-demo">· Placeholder audio</span>' : '');
    titleEl.textContent = s.title;
    menu.querySelectorAll('.etb-ap-item').forEach(function (b) { b.classList.toggle('is-current', +b.dataset.i === cur); });
    if ('mediaSession' in navigator && window.MediaMetadata) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: D.author || '', album: (D.book_title ? D.book_title + ' · ' : '') + 'Chapter ' + D.chapter });
    }
  }

  function paint(t) {
    if (t === undefined) t = globalTime();
    var p = total ? t / total : 0;
    fill.style.width = (p * 100) + '%';
    thumb.style.left = (p * 100) + '%';
    if (!dragging) range.value = Math.round(p * 1000);
    curT.textContent = fmt(t);
    durT.textContent = fmt(total);
    range.setAttribute('aria-valuetext', fmt(t) + ' of ' + fmt(total));
  }

  var lastSave = 0;
  audio.addEventListener('timeupdate', function () {
    if (dragging) return;
    paint();
    var now = Date.now();
    if (now - lastSave > 4000) { lastSave = now; store(KEY, { t: globalTime() }); }
  });
  function wordState() {
    S.forEach(function (s, i) {
      if (!s.btn) return;
      s.btn.querySelector('.etb-listen-word').textContent = i !== cur ? 'Listen' : (audio.paused ? 'Paused' : 'Playing');
    });
  }
  audio.addEventListener('play', function () { document.documentElement.classList.add('etb-playing'); playBtn.setAttribute('aria-label', 'Pause'); wordState(); });
  audio.addEventListener('pause', function () { document.documentElement.classList.remove('etb-playing'); playBtn.setAttribute('aria-label', 'Play'); if (cur >= 0) store(KEY, { t: globalTime() }); updatePill(); wordState(); });
  audio.addEventListener('ended', function () {
    if (cur < S.length - 1) load(cur + 1, 0, true);
    else { store(KEY, { t: 0 }); document.documentElement.classList.remove('etb-playing'); updatePill(); }
  });

  playBtn.addEventListener('click', function () {
    if (cur < 0) { seek(resumeAt(), true); return; }
    if (audio.paused) audio.play().catch(function () {}); else audio.pause();
  });
  q('.etb-ap-back').addEventListener('click', function () { seek(globalTime() - 15); });
  q('.etb-ap-fwd').addEventListener('click', function () { seek(globalTime() + 15); });

  speedBtn.textContent = rate + '×';
  speedBtn.addEventListener('click', function () {
    rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
    audio.defaultPlaybackRate = audio.playbackRate = rate;
    speedBtn.textContent = rate + '×';
    store('etb-audio:rate', rate);
  });

  function toggleMenu(force) {
    var on = force !== undefined ? force : !menu.classList.contains('is-open');
    menu.classList.toggle('is-open', on);
    listBtn.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  listBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleMenu(); });
  menu.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { toggleMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') toggleMenu(false); });

  q('.etb-ap-now').addEventListener('click', function () {
    var e = S[cur] && S[cur].els[0];
    if (e) e.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* scrubber */
  range.addEventListener('input', function () { dragging = true; track.classList.add('is-drag'); paint(range.value / 1000 * total); });
  range.addEventListener('change', function () { dragging = false; track.classList.remove('is-drag'); seek(range.value / 1000 * total); });
  track.addEventListener('mousemove', function (e) {
    var r = track.getBoundingClientRect(), p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), t = p * total;
    tip.innerHTML = '<b>' + fmt(t) + '</b>' + S[sectionAt(t)].title;
    tip.style.left = Math.min(r.width - 60, Math.max(60, p * r.width)) + 'px';
  });

  function open() {
    ap.classList.add('is-open');
    root.classList.add('etb-audio-on');
  }
  q('.etb-ap-close').addEventListener('click', function () {
    if (cur >= 0) store(KEY, { t: globalTime() });
    audio.pause();
    ap.classList.remove('is-open');
    root.classList.remove('etb-audio-on');
    S.forEach(function (s) { s.els.forEach(function (e) { e.classList.remove('etb-audio-current'); }); if (s.btn) s.btn.classList.remove('is-current'); });
    cur = -1; audio.removeAttribute('src'); audio.load(); wordState(); updatePill();
    toggleMenu(false);
    if (pill) pill.focus();
  });

  function updatePill() {
    if (!pillText) return;
    var r = resumeAt();
    pillText.textContent = r ? 'Resume · ' + fmt(r) : 'Listen';
    pill.querySelector('.etb-listen-len').style.display = r ? 'none' : '';
  }

  if ('mediaSession' in navigator) {
    var ms = navigator.mediaSession;
    try {
      ms.setActionHandler('play', function () { audio.play(); });
      ms.setActionHandler('pause', function () { audio.pause(); });
      ms.setActionHandler('seekbackward', function () { seek(globalTime() - 15); });
      ms.setActionHandler('seekforward', function () { seek(globalTime() + 15); });
      ms.setActionHandler('previoustrack', function () { seek(offsets[Math.max(0, cur - 1)]); });
      ms.setActionHandler('nexttrack', function () { if (cur < S.length - 1) seek(offsets[cur + 1]); });
    } catch (e) {}
  }

  paintTicks(); buildMenu(); paint(0); updatePill();
})();
</script>
